<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DGA306 Interactive Guide</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            width: 100%;
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid #e2e8f0;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2rem;
            color: #1e3a8a;
            margin-bottom: 8px;
        }
        
        .header p {
            font-size: 1.1rem;
            color: #64748b;
        }
        
        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background-color: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            text-decoration: none;
            color: #1e293b;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.2s ease;
        }
        
        .menu-item:hover {
            background-color: #e2e8f0;
            border-color: #94a3b8;
            transform: translateX(4px);
        }
        
        .menu-item .title {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .menu-item .desc {
            font-size: 0.9rem;
            font-weight: 400;
            color: #64748b;
        }

        .menu-item .arrow {
            color: #94a3b8;
            font-weight: bold;
        }
        
        .menu-item:hover .arrow {
            color: #1e3a8a;
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }
            
            .menu-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }
            
            .menu-item .arrow {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>DGA306 Interactive Guide</h1>
            <p>Select a lesson to continue</p>
        </div>
        
        <div class="menu-list">
            <a href="day0.html" class="menu-item">
                <div class="title">
                    <span>Day 0</span>
                    <span class="desc">Getting Started</span>
                </div>
                <span class="arrow">→</span>
            </a>
            
            <a href="day1.html" class="menu-item">
                <div class="title">
                    <span>Day 1</span>
                    <span class="desc">Python & Data Analytics</span>
                </div>
                <span class="arrow">→</span>
            </a>
            
            <a href="day2.html" class="menu-item">
                <div class="title">
                    <span>Day 2</span>
                    <span class="desc">Data Warehouse</span>
                </div>
                <span class="arrow">→</span>
            </a>
            
            <a href="day3.html" class="menu-item">
                <div class="title">
                    <span>Day 3</span>
                    <span class="desc">Analysis & Visualization</span>
                </div>
                <span class="arrow">→</span>
            </a>
            
            <a href="day4.html" class="menu-item">
                <div class="title">
                    <span>Day 4</span>
                    <span class="desc">Predictive Analytics & ML</span>
                </div>
                <span class="arrow">→</span>
            </a>
            
            <a href="day5.html" class="menu-item">
                <div class="title">
                    <span>Day 5</span>
                    <span class="desc">Data Storytelling</span>
                </div>
                <span class="arrow">→</span>
            </a>
        </div>
    </div>
</body>
</html>
